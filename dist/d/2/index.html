    <h1><span class="day">Day 2</span>Windows 按 Ctrl+V 貼不了截圖給 Claude Code，不是壞掉，是鍵不對。</h1>
    <time>2026-07-18</time>
    <div class="text">我本來也以為複製貼上截圖是 Mac 限定，按了沒反應就放棄。

結果 Windows 要按 Alt+V。

Win+Shift+S 截圖 → 回終端機 Alt+V，圖就進去了。
懶得記的話，把圖檔直接拖進視窗也行。</div>
