  <h1><span class="day">Day 19</span>Claude 接管瀏覽器之後點錯地方,九成是你的縮放沒調回來</h1>
  <time>2026-08-04</time>
  <div class="text">它不是讀網頁原始碼再算位置,是先截一張圖,再照圖上的座標點下去

所以你把頁面放大到 150%,它看到的畫面就跟平常不一樣,按鈕跑掉它就點在空的地方

- 而且它自己調不了: Ctrl+0、Ctrl+ 加、Ctrl+ 減這幾個縮放快捷鍵,工具直接回錯誤,只能你先調好

叫它做事之前: Ctrl+0 把縮放歸零</div>
