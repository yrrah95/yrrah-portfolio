<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>示意畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../css/tokens.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: var(--font-body);
    padding: var(--space-2xl);
    width: 1040px;
  }
  .dash {
    display: grid;
    gap: var(--space-xl);
  }
  .dash__hero {
    display: flex;
    align-items: baseline;
    gap: var(--space-lg);
  }
  .dash__count {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 4rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .dash__count-label {
    color: var(--color-muted);
    font-size: var(--text-md);
  }

  .card {
    background: var(--color-paper-2);
    border-radius: 14px;
    padding: var(--space-lg);
  }

  .timeline {
    display: flex;
    gap: var(--space-md);
  }
  .timeline__node {
    flex: 1;
    padding: var(--space-md);
    border-radius: 14px;
    background: var(--color-paper-2);
  }
  .timeline__node--done { background: var(--color-rule); }
  .timeline__node--now { background: var(--color-accent); color: var(--color-paper); }
  .timeline__node-label { font-size: var(--text-sm); font-weight: 500; margin-bottom: var(--space-2xs); }
  .timeline__node-date { font-size: var(--text-xs); font-variant-numeric: tabular-nums; opacity: 0.75; }

  .score-row { display: flex; align-items: center; gap: var(--space-md); margin-bottom: var(--space-md); }
  .score-row:last-child { margin-bottom: 0; }
  .score-row__label { width: 8rem; font-size: var(--text-sm); flex-shrink: 0; }
  .score-row__track { flex: 1; height: 18px; border-radius: 999px; background: var(--color-rule); overflow: hidden; }
  .score-row__fill { height: 100%; border-radius: 999px; background: var(--color-ink); }
  .score-row__value { width: 3.5rem; text-align: right; font-size: var(--text-sm); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .tasks__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--space-md); }
  .tasks__count { font-family: var(--font-display); font-weight: 700; font-size: var(--text-2xl); font-variant-numeric: tabular-nums; }
  .tasks__track { height: 6px; border-radius: 999px; background: var(--color-rule); margin-bottom: var(--space-lg); overflow: hidden; }
  .tasks__fill { height: 100%; border-radius: 999px; background: var(--color-accent); }
  .tasks__list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-sm); }
  .tasks__item { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-sm); }
  .tasks__item--done { color: var(--color-muted); text-decoration: line-through; }
  .tasks__check { width: 18px; height: 18px; border-radius: 999px; border: 1.5px solid var(--color-rule); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .tasks__item--done .tasks__check { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-paper); }

  h2 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; margin: 0 0 var(--space-md); }
</style>
</head>
<body>
  <div class="dash">
    <div class="dash__hero">
      <span class="dash__count">42</span>
      <span class="dash__count-label">天後進入下一關<br />示意資料，非真實進度</span>
    </div>

    <div class="timeline">
      <div class="timeline__node timeline__node--done">
        <div class="timeline__node-label">準備資料</div>
        <div class="timeline__node-date">已完成</div>
      </div>
      <div class="timeline__node timeline__node--done">
        <div class="timeline__node-label">送出申請</div>
        <div class="timeline__node-date">已完成</div>
      </div>
      <div class="timeline__node timeline__node--now">
        <div class="timeline__node-label">資格審查</div>
        <div class="timeline__node-date">進行中</div>
      </div>
      <div class="timeline__node">
        <div class="timeline__node-label">結果公布</div>
        <div class="timeline__node-date">42 天後</div>
      </div>
    </div>

    <div class="card">
      <h2>分數怎麼算</h2>
      <div class="score-row">
        <span class="score-row__label">基本資格 · 20%</span>
        <div class="score-row__track"><div class="score-row__fill" style="width:100%"></div></div>
        <span class="score-row__value">20/20</span>
      </div>
      <div class="score-row">
        <span class="score-row__label">書面審查 · 30%</span>
        <div class="score-row__track"><div class="score-row__fill" style="width:60%"></div></div>
        <span class="score-row__value">18/30</span>
      </div>
      <div class="score-row">
        <span class="score-row__label">面談 · 50%</span>
        <div class="score-row__track"><div class="score-row__fill" style="width:0%"></div></div>
        <span class="score-row__value">?/50</span>
      </div>
    </div>

    <div class="card tasks">
      <div class="tasks__head">
        <h2 style="margin:0">準備進度</h2>
        <span class="tasks__count">5 / 12 項</span>
      </div>
      <div class="tasks__track"><div class="tasks__fill" style="width:42%"></div></div>
      <ul class="tasks__list">
        <li class="tasks__item tasks__item--done"><span class="tasks__check">✓</span>整理備審資料</li>
        <li class="tasks__item tasks__item--done"><span class="tasks__check">✓</span>寫讀書計畫</li>
        <li class="tasks__item"><span class="tasks__check"></span>找兩位推薦人</li>
        <li class="tasks__item"><span class="tasks__check"></span>模擬面試練習</li>
      </ul>
    </div>
  </div>
</body>
</html>
