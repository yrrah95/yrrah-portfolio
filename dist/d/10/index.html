  <div class="text">你以為你常用的，跟你實際一直在按同意的，不是同一批

內建有個指令會幫你統計:

1. 翻你過去的對話紀錄
2. 挑出最常放行、而且只讀不改的指令
3. 照出現次數排優先序
4. 寫進專案的 .claude/settings.json

會動到東西的照樣跳確認
刪檔、推 code 不會被靜音

指令:
/fewer-permission-prompts</div>
