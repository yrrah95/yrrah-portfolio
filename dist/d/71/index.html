  <div class="text">Claude 回的字一行拉到最右邊 看完一行要找半天下一行在哪？

2.1.282 加了一個設定 段落收窄 表格跟程式碼照樣全寬</div>
  <div class="car" data-n="4" tabindex="0" aria-roledescription="carousel" aria-label="Day 71 圖卡">
  <div class="track"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D71/01-cover.png" alt="Day 71 第 1 張" ><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D71/02-list.png" alt="Day 71 第 2 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D71/03-list.png" alt="Day 71 第 3 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D71/04-steps.png" alt="Day 71 第 4 張" loading="lazy"></div>
  <button type="button" class="nav prev" aria-label="上一張" hidden>‹</button>
  <button type="button" class="nav next" aria-label="下一張">›</button>
  <div class="bar"><span class="count">1 / 4</span><span class="dots"><button type="button" aria-label="第 1 張" class="on"></button><button type="button" aria-label="第 2 張"></button><button type="button" aria-label="第 3 張"></button><button type="button" aria-label="第 4 張"></button></span></div>
</div>
<script>
(function(){var c=document.currentScript.previousElementSibling,t=c.querySelector('.track'),ds=c.querySelectorAll('.dots button'),pv=c.querySelector('.prev'),nx=c.querySelector('.next'),ct=c.querySelector('.count'),n=ds.length;
var want=null;
function cur(){return Math.round(t.scrollLeft/t.clientWidth)}
function base(){return want===null?cur():want}
function go(i){i=Math.max(0,Math.min(n-1,i));want=i;t.scrollTo({left:i*t.clientWidth,behavior:'smooth'})}
t.addEventListener('scroll',function(){var i=cur();if(want!==null&&i===want)want=null;ds.forEach(function(d,k){d.classList.toggle('on',k===i)});ct.textContent=(i+1)+' / '+n;pv.hidden=i===0;nx.hidden=i===n-1},{passive:true});
['touchstart','wheel','pointerdown'].forEach(function(ev){t.addEventListener(ev,function(){want=null},{passive:true})});
pv.onclick=function(){go(base()-1)};nx.onclick=function(){go(base()+1)};
ds.forEach(function(d,k){d.onclick=function(){go(k)}});
c.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){go(base()-1);e.preventDefault()}if(e.key==='ArrowRight'){go(base()+1);e.preventDefault()}});
})();
</script>
  <pre class="cta">先更新到 2.1.282 以上:
claude update

再到 ~/.claude/settings.json 的大括號裡加一行（100 可以換成你要的欄數 最少 40）:
&quot;maxProseWidth&quot;: 100</pre>
