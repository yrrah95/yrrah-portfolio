    <time>2026-08-09</time>
    <div class="text">七月底上線的新版改成一輪問一批

- 原理: 它先把你的計畫攤成一棵決策樹,挑出「不用等別題答案就能問」的那幾題,一次全部丟給你

你一次答完,它重算一輪,把剛才被卡住的問題放進下一批
要靠別題答案才能問的,排到後面才問

查得到的事實它自己派人去查,不會停在那裡等你

更新方法:
claude plugin update mattpocock-skills</div>
