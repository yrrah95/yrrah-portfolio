  <h1><span class="day">Day 93</span>Claude Code 有個 --max-budget-usd 旗標</h1>
  <time>2026-10-17</time>
  <div class="text">用 claude -p 丟著跑 怕它一直燒錢？
給它一個美元上限 花到就自己停</div>
  <div class="imgs"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D93/01-cover.png" alt="Day 93 第 1 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D93/02-list.png" alt="Day 93 第 2 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D93/03-terminal.png" alt="Day 93 第 3 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D93/04-terminal.png" alt="Day 93 第 4 張" loading="lazy"></div>
  <pre class="cta">設花費上限（金額是美元 只在 claude -p 有效）:
claude -p 摘要檔 --max-budget-usd 1

「摘要檔」換成你要它做的事</pre>
