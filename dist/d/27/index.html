  <h1><span class="day">Day 27</span>Claude Code 可以用手機操作了</h1>
  <time>2026-08-12</time>
  <div class="text">但它不是在雲端跑,跑的還是你桌上那台電腦

1. 電腦打一行指令,手機掃 QR code 就接上,要 Pro 或 Max 方案
2. 它要動手改東西,你在手機上按核准就行
3. 手機拍的照片直接貼進去給它看,不用先存檔再叫它讀
4. 筆電睡著或斷網,醒來會自己接回去

指令: claude --remote-control</div>
