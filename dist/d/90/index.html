  <h1><span class="day">Day 90</span>Claude Code 有個 --add-dir 旗標</h1>
  <time>2026-10-14</time>
  <div class="text">專案外面的共用文件 預設不讓它讀 加法有三種
加上之後 它就讀得到 內容照樣列給你</div>
  <div class="imgs"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D90/01-cover.png" alt="Day 90 第 1 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D90/02-steps.png" alt="Day 90 第 2 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D90/03-list.png" alt="Day 90 第 3 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D90/04-terminal.png" alt="Day 90 第 4 張" loading="lazy"><img src="https://raw.githubusercontent.com/yrrah95/threads-cards/main/tips/D90/05-terminal.png" alt="Day 90 第 5 張" loading="lazy"></div>
  <pre class="cta">啟動時加（../kb 換成你的資料夾）:
claude --add-dir ../kb

對話中途加:
/add-dir ../kb

加好之後 跟 Claude 說:
讀 ../kb/r.md</pre>
